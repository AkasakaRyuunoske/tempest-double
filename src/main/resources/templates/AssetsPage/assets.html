<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${@environment.getProperty('spring.application.name')}">Project Name</title>
    <link rel="stylesheet" href="AssetsPage/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header (buttons, logo and project name) -->
<header class="header">
    <button class="menu-button" onclick="toggleMenu()">

    <div class="logo-container">
        <img src="HomePage/img/logo.png" alt="Logo" class="logo" style="border-radius: 30%">
        <h1 th:text="${@environment.getProperty('spring.application.name')}"></h1>
    </div>
</header>

<!-- Menu (change with real page names)-->
<nav id="dropdown-menu" class="dropdown-menu">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Assets</a></li>
        <li><a href="#">Simulation</a></li>
        <li><a href="#">History</a></li>
    </ul>
</nav>

<div class="content">
    <h1 class="animate-slide-in-left">Assets</h1>



    <script src="AssetsPage/js/script.js"></script>
</div>

</html>
