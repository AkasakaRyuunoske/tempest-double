<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${@environment.getProperty('spring.application.name')}"></title>
    <link rel="stylesheet" href="HistoryPage/css/history.css">
</head>
<body>

<th:block th:replace="~{Components/header :: header}"></th:block>

<main class="content">

        <div class="select-delete-container animate-slide-in-left">
            <div class="checkbox-label">
                <input type="checkbox" id="select-all" />
                <label for="select-all"><strong>Seleziona tutte le card</strong></label>
            </div>
            <button id="delete-selected" class="delete-button">Delete selected</button>
        </div>

    <div id="cards-container"></div>

    <div id="modal-overlay">
        <div id="modal-content"></div>
    </div>

</main>

</body>

<script src="HistoryPage/js/history.js"></script>

</html>
