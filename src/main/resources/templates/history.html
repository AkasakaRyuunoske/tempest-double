<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${@environment.getProperty('spring.application.name')}"></title>
    <link rel="stylesheet" href="HistoryPage/css/history.css">

    <style>
        /* Basic styling for the modal overlay */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; /* hidden by default */
            justify-content: center;
            align-items: center;
        }
        #modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 4px;
            max-width: 600px;
            width: 100%;
        }

        .session-card {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            cursor: pointer;
            /* example animation class */
            animation: slideInLeft 0.3s ease-out;
        }
        /* Example animation (optional) */
        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        .card-header {
            display: flex;
            align-items: center;
        }
        .card-header h3 {
            margin-left: 8px;
        }
        .card-checkbox {
            margin-right: 8px;
        }
        .card-content p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

<th:block th:replace="~{Components/header :: header}"></th:block>

<main class="content">

        <div class="select-delete-container animate-slide-in-left">
            <div class="checkbox-label">
                <input type="checkbox" id="select-all" />
                <label for="select-all"><strong>Seleziona tutte le card</strong></label>
            </div>
            <button id="delete-selected" class="delete-button">Delete selected</button>
        </div>

    <div id="cards-container"></div>

    <div id="modal-overlay">
        <div id="modal-content"></div>
    </div>

</main>

</body>

<script src="HistoryPage/js/history.js"></script>

</html>
