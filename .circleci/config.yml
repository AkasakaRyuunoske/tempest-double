version: 2.1
jobs:
  test-java:
    docker:
      - image: cimg/openjdk:17.0  # Primary container
      - image: mysql:8.0         # MySQL service container
        environment:
          MYSQL_ROOT_PASSWORD: 12345
          MYSQL_DATABASE: test
          MYSQL_USER: ghostmountain
          MYSQL_PASSWORD: 123
      - image: selenium/standalone-chrome  # Selenium container
        environment:
          SCREEN_WIDTH: 1920
          SCREEN_HEIGHT: 1080
          SCREEN_DEPTH: 24
    steps:
      - checkout
      - run:
          name: Wait for Selenium
          command: |
            echo "Waiting for Selenium to be ready..."
            until curl -s http://10.89.2.3:4444/wd/hub/status | grep '"ready":true'; do
              sleep 3
            done
            echo "Selenium is ready!"
      - run:
          name: Create .env file
          command: |
            echo "MYSQL_ROOT_PASSWORD=12345" > .env
            echo "MYSQL_DATABASE=test" >> .env
            echo "MYSQL_USER=ghostmountain" >> .env
            echo "MYSQL_PASSWORD=123" >> .env
            echo "SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306" >> .env
      - run:
          name: Calculate cache key
          command: |-
            find . -name 'pom.xml' -o -name 'gradlew*' -o -name '*.gradle*' | \
                    sort | xargs cat > /tmp/CIRCLECI_CACHE_KEY
      - restore_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
      - run:
          name: Run Maven tests
          command: mvn verify
      - store_test_results:
          path: target/surefire-reports
      - save_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
          paths:
            - ~/.m2/repository

workflows:
  build-and-test:
    jobs:
      - test-java
